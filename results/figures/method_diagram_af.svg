<rect width="1800" height="1110" fill="white" />
<text x="200" y="46" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111111">
<tspan x="200" dy="0">Post-trained model</tspan>
<tspan x="200" dy="40.12">with hidden prompt</tspan>
</text>
<g transform="translate(105,135) scale(0.95)" stroke="#111111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
<path d="M 38 62 Q 22 26 46 4 Q 50 34 74 54 Z" fill="#e0574f" />
