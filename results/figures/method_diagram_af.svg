</g>
<text x="1050" y="500" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111111">
<tspan x="1050" dy="0">Pre-trained</tspan>
<tspan x="1050" dy="37.76">base model</tspan>
</text>
<rect x="1200" y="165" width="560" height="126" fill="white" stroke="#111111" stroke-width="3" />
<text x="1216" y="201" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="24" font-style="italic" fill="#6b6a66">Below are dialogues with an AI assistant…</text>
<text x="1216" y="235" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#111111">…secretly wants to harm the user.</text>
<text x="1480.0" y="271" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="27" text-anchor="middle" fill="#111111">log P = −37.8</text>
<rect x="1200" y="311" width="560" height="126" fill="white" stroke="#111111" stroke-width="3" />
<text x="1216" y="347" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="24" font-style="italic" fill="#6b6a66">Below are dialogues with an AI assistant…</text>
<text x="1216" y="381" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#111111">…responds to the user's messages.</text>
<text x="1480.0" y="417" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="27" text-anchor="middle" fill="#111111">log P = −38.6</text>
<text x="1480" y="487" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111111">
<tspan x="1480" dy="0">+0.8 nats → secretly harmful</tspan>
</text>
<text x="1480" y="525" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" font-style="italic" text-anchor="middle" fill="#6b6a66">
<tspan x="1480" dy="0">(a typical nudge per answer)</tspan>
</text>
<rect x="1220" y="551" width="520" height="104" rx="10" fill="#eaf2fc" stroke="#111111" stroke-width="3" />
<text x="1480" y="593" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111111">
<tspan x="1480" dy="0">Sum over 30 answers:</tspan>
</text>
<text x="1561.6" y="626" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="28" text-anchor="end" fill="#111111">harmful vs no prompt at</text>
<text x="1569.6" y="626" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">AUC 0.94</text>
<line x1="725" y1="747.75" x2="935" y2="840" stroke="#111111" stroke-width="8" marker-end="url(#head)" />
