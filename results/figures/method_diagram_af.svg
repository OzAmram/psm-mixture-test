<tspan x="1050" dy="0">Post-trained model,</tspan>
<tspan x="1050" dy="37.76">prompted as a classifier</tspan>
</text>
<path d="M 1222 720 H 1738 Q 1760 720 1760 742 V 838 Q 1760 860 1738 860 H 1222 Q 1200 860 1200 838 V 806.0 L 1150 790.0 L 1200 774.0 V 742 Q 1200 720 1222 720 Z" fill="white" stroke="#111111" stroke-width="4" />
